openapi: 3.1.0
info:
  title: Xingshu Local Project Index API
  version: 0.1.0
  description: Localhost API for the Xingshu project and Git repository index.
servers:
  - url: http://127.0.0.1:12681
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/v1/repos:
    get:
      operationId: listRepos
      responses:
        '200':
          description: Indexed repositories with project tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Repo' }
  /api/v1/repos/{repoId}/pull:
    post:
      operationId: pullRepo
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
      responses:
        '200': { $ref: '#/components/responses/PullResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/repos/{repoId}/pull/{action}:
    post:
      operationId: resolvePullConflict
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [backup, overwrite, abort] }
      responses:
        '200': { $ref: '#/components/responses/PullResult' }
  /api/v1/repos/{repoId}/tags:
    post:
      operationId: attachTag
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagReference' }
      responses:
        '204': { description: Tag attached }
    delete:
      operationId: detachTag
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagReference' }
      responses:
        '204': { description: Tag detached }
  /api/v1/roots:
    get:
      operationId: listRoots
      responses:
        '200':
          description: Registered roots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Root' }
    post:
      operationId: createRoot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoot' }
      responses:
        '201': { description: Root created }
        '400': { $ref: '#/components/responses/ProblemResponse' }
  /api/v1/roots/{rootId}:
    delete:
      operationId: deleteRoot
      parameters:
        - { $ref: '#/components/parameters/RootId' }
      responses:
        '204': { description: Root deleted }
        '404': { $ref: '#/components/responses/ProblemResponse' }
  /api/v1/repos/{repoId}:
    put:
      operationId: updateRepoKind
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRepoKind' }
      responses:
        '204': { description: Kind updated }
        '400': { $ref: '#/components/responses/ProblemResponse' }
  /api/v1/tags:
    get:
      operationId: listTags
      responses:
        '200':
          description: Project tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
    post:
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTag' }
      responses:
        '201': { description: Tag created }
  /api/v1/stats:
    get:
      operationId: getStats
      responses:
        '200':
          description: Index statistics with kind breakdown
          content:
            application/json:
              schema:
                type: object
                required: [repositories, bytes, byKind]
                properties:
                  repositories: { type: integer, minimum: 0 }
                  bytes: { type: integer, minimum: 0 }
                  byKind: { type: object, additionalProperties: { type: integer, minimum: 0 } }
  /api/v1/repos/{repoId}/fetch_log:
    get:
      operationId: listFetchLogs
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
      responses:
        '200':
          description: Fetch history for a repository
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FetchLog' }
  /api/v1/repos/{repoId}/move:
    post:
      operationId: moveRepo
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetRootId]
              properties:
                targetRootId: { type: integer }
      responses:
        '200':
          description: Repository moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
  /api/v1/repos/{repoId}/policy:
    get:
      operationId: getRepoPolicy
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
      responses:
        '200':
          description: Repository pull policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
    put:
      operationId: setRepoPolicy
      parameters:
        - { $ref: '#/components/parameters/RepoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '204': { description: Policy updated }
  /api/v1/tags/{tagId}/policy:
    get:
      operationId: getTagPolicy
      parameters:
        - { $ref: '#/components/parameters/TagId' }
      responses:
        '200':
          description: Tag pull policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
    put:
      operationId: setTagPolicy
      parameters:
        - { $ref: '#/components/parameters/TagId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '204': { description: Policy updated }
  /api/v1/scan:
    post:
      operationId: triggerScan
      responses:
        '200':
          description: Scan completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanReport' }
  /api/v1/tasks:
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTask' }
      responses:
        '202':
          description: Task accepted for asynchronous execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAccepted' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/TaskBusy' }
  /api/v1/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
      responses:
        '200':
          description: Persisted task snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
  /api/v1/tasks/{taskId}/conflicts:
    get:
      operationId: listTaskConflicts
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
      responses:
        '200':
          description: Repository conflicts requiring a decision
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskConflict' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
  /api/v1/tasks/{taskId}/repos/{repoId}/decision:
    post:
      operationId: decideTaskRepoConflict
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/RepoId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskRepoDecision' }
      responses:
        '202':
          description: Conflict decision accepted for asynchronous execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDecisionAccepted' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/TaskDecisionConflict' }
  /api/v1/tasks/{taskId}/stream:
    get:
      operationId: streamTask
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, minimum: 0 }
          description: Resume cursor. The server always sends a fresh snapshot
            first, then replays only in-memory events with sequence greater
            than this id (already-seen events are suppressed, never replacing
            the persisted snapshot).
      responses:
        '200':
          description: Server-sent task snapshot and progress events
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/ProblemResponse' }
  /api/v1/open:
    post:
      operationId: openPath
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenPathRequest' }
      responses:
        '204': { description: Directory opened in the OS file manager }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '500': { $ref: '#/components/responses/ProblemResponse' }
  /api/v1/tags/{tagId}:
    delete:
      operationId: deleteTag
      parameters:
        - { $ref: '#/components/parameters/TagId' }
      responses:
        '204': { description: Tag deleted }
        '404': { $ref: '#/components/responses/ProblemResponse' }
components:
  parameters:
    RepoId:
      name: repoId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RootId:
      name: rootId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    Repo:
      type: object
      required: [id, rootId, org, name, relPath, repoKind, cloneStatus, sizeBytes, tags]
      properties:
        id: { type: integer }
        rootId: { type: integer }
        org: { type: string }
        name: { type: string }
        relPath: { type: string }
        remoteUrl: { type: [string, 'null'] }
        defaultBranch: { type: [string, 'null'] }
        headCommit: { type: [string, 'null'] }
        repoKind: { type: string, enum: [third-party, third-party-frozen, fork, own] }
        cloneStatus: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        modifyLock: { type: boolean }
        lockViolation: { type: boolean }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Root:
      type: object
      required: [id, name, path, priority]
      properties:
        id: { type: integer }
        name: { type: string }
        path: { type: string }
        diskLabel: { type: [string, 'null'] }
        mountPoint: { type: [string, 'null'] }
        priority: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Tag:
      type: object
      required: [id, slug, label, kind]
      properties:
        id: { type: integer }
        slug: { type: string }
        label: { type: string }
        color: { type: [string, 'null'] }
        kind: { type: string, enum: [auto, manual] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTag:
      type: object
      required: [slug]
      properties:
        slug: { type: string, minLength: 1 }
        label: { type: string }
        color: { type: string }
    CreateRoot:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Absolute path to root directory }
        diskLabel: { type: [string, 'null'] }
        mountPoint: { type: [string, 'null'] }
        priority: { type: integer, default: 0 }
    UpdateRepoKind:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [third-party, third-party-frozen, fork, own] }
        upstreamRemote: { type: [string, 'null'], description: Remote name for fork upstream }
    FetchLog:
      type: object
      properties:
        id: { type: [integer, 'null'] }
        repoId: { type: integer }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        strategy: { type: string }
        result: { type: string }
        objects: { type: [integer, 'null'] }
        bytes: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Policy:
      type: object
      properties:
        id: { type: [integer, 'null'] }
        repoId: { type: [integer, 'null'] }
        tagId: { type: [integer, 'null'] }
        pullStrategy: { type: string }
        pullConflictPolicy: { type: string }
        unattendedConflictPolicy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PolicyRequest:
      type: object
      properties:
        pullStrategy: { type: string }
        conflict: { type: string }
        unattended: { type: string }
    ScanReport:
      type: object
      required: [rootsScanned, reposFound, brokenRepos, skippedDirectories, nestedRepos, errors]
      properties:
        rootsScanned: { type: integer }
        reposFound: { type: integer }
        brokenRepos: { type: integer }
        skippedDirectories: { type: integer }
        nestedRepos: { type: integer }
        errors: { type: array, items: { type: string } }
    CreateTask:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [scan, pull] }
        conflictMode: { type: string, enum: [policy, ask], default: policy, description: Use ask to keep conflicts waiting for an explicit repository decision }
    TaskAccepted:
      type: object
      required: [taskId, operationId, status, conflictMode]
      properties:
        taskId: { type: string }
        operationId: { type: string }
        status: { type: string, const: pending }
        conflictMode: { type: string, enum: [policy, ask] }
    Task:
      type: object
      required: [taskId, type, status, conflictMode, requestId, operationId, progressCurrent, progressTotal, lastRepo, lastResult, error, resultJson, createdAt, updatedAt]
      properties:
        taskId: { type: string }
        type: { type: string, enum: [scan, pull] }
        status: { type: string, enum: [pending, running, waiting_for_decision, completed, failed, interrupted] }
        conflictMode: { type: string, enum: [policy, ask] }
        requestId: { type: [string, 'null'] }
        operationId: { type: string }
        progressCurrent: { type: [integer, 'null'], minimum: 0 }
        progressTotal: { type: [integer, 'null'], minimum: 0 }
        lastRepo: { type: [string, 'null'] }
        lastResult: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        resultJson: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskConflict:
      type: object
      required: [taskId, repoId, repoName, repoPath, status, conflictReason, allowedActions, requestedAction, result, durationMs, backupPath, error]
      properties:
        taskId: { type: string }
        repoId: { type: integer, minimum: 1 }
        repoName: { type: string }
        repoPath: { type: string }
        status: { type: string, enum: [waiting_decision, resolving, failed, interrupted] }
        conflictReason: { type: [string, 'null'] }
        conflict:
          oneOf:
            - $ref: '#/components/schemas/ConflictInfoDirty'
            - $ref: '#/components/schemas/ConflictInfoDiverged'
          nullable: true
          description: Structured conflict details; null falls back to conflictReason text.
        allowedActions: { type: array, items: { type: string, enum: [backup, overwrite, abort] } }
        requestedAction: { type: [string, 'null'], enum: [backup, overwrite, abort, null] }
        result: { type: [string, 'null'] }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        backupPath: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
    ConflictInfoDirty:
      type: object
      required: [kind, reason, ahead, behind, localOnly, upstreamOnly, equivalent, statusEntries, staged, modified, untracked]
      properties:
        kind: { type: string, const: dirty }
        reason: { type: string }
        ahead: { type: integer, minimum: 0 }
        behind: { type: integer, minimum: 0 }
        mergeBase: { type: [string, 'null'] }
        mergeBaseDate: { type: [string, 'null'] }
        localOnly: { type: array, items: { $ref: '#/components/schemas/CommitBrief' } }
        upstreamOnly: { type: array, items: { $ref: '#/components/schemas/CommitBrief' } }
        equivalent:
          type: array
          description: Patch-equivalent (local, upstream) short-hash pairs from `git cherry`.
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        statusEntries:
          type: array
          description: `git status --porcelain` entries (index code, worktree code, path).
          items:
            type: object
            required: [index, worktree, path]
            properties:
              index: { type: string }
              worktree: { type: string }
              path: { type: string }
        staged: { type: integer, minimum: 0 }
        modified: { type: integer, minimum: 0 }
        untracked: { type: integer, minimum: 0 }
    ConflictInfoDiverged:
      type: object
      required: [kind, reason, ahead, behind, mergeBase, localOnly, upstreamOnly, equivalent, statusEntries, staged, modified, untracked]
      properties:
        kind: { type: string, enum: [diverged, nonFf] }
        reason: { type: string }
        ahead: { type: integer, minimum: 0 }
        behind: { type: integer, minimum: 0 }
        mergeBase: { type: [string, 'null'] }
        mergeBaseDate: { type: [string, 'null'] }
        localOnly: { type: array, items: { $ref: '#/components/schemas/CommitBrief' } }
        upstreamOnly: { type: array, items: { $ref: '#/components/schemas/CommitBrief' } }
        equivalent:
          type: array
          description: Patch-equivalent (local, upstream) short-hash pairs from `git cherry`.
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        statusEntries: { type: array, items: { type: object } }
        staged: { type: integer, minimum: 0 }
        modified: { type: integer, minimum: 0 }
        untracked: { type: integer, minimum: 0 }
    CommitBrief:
      type: object
      required: [short, summary, author, date]
      properties:
        short: { type: string }
        summary: { type: string }
        author: { type: string }
        date: { type: string }
    OpenPathRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute path to open; must canonicalize under at least one registered root.
    TaskRepoDecision:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [backup, overwrite, abort] }
    TaskDecisionAccepted:
      type: object
      required: [taskId, repoId, status, action]
      properties:
        taskId: { type: string }
        repoId: { type: integer, minimum: 1 }
        status: { type: string, const: resolving }
        action: { type: string, enum: [backup, overwrite, abort] }
    TaskEvent:
      type: object
      properties:
        sequence: { type: integer, minimum: 1 }
        event: { type: string }
        taskId: { type: string }
        repoId: { type: [integer, 'null'], minimum: 1 }
        repoStatus: { type: [string, 'null'] }
        conflictReason: { type: [string, 'null'] }
        requestedAction: { type: [string, 'null'] }
        backupPath: { type: [string, 'null'] }
        current: { type: [integer, 'null'], minimum: 0 }
        total: { type: [integer, 'null'], minimum: 0 }
        lastRepo: { type: [string, 'null'] }
        lastResult: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        durationMs: { type: [integer, 'null'], minimum: 0 }
    TagReference:
      type: object
      required: [slug]
      properties:
        slug: { type: string, minLength: 1 }
    PullResult:
      description: Pull operation result
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result: { type: string, enum: [ok, skipped, aborted] }
              backupPath: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, code, requestId, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        requestId: { type: string }
        detail: { type: string }
  responses:
    PullResult:
      description: Pull operation result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PullResult' }
    Conflict:
      description: A user decision is required
      content:
        application/problem+json:
           schema: { $ref: '#/components/schemas/Problem' }
    TaskBusy:
      description: A task of the same type is already running
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TaskDecisionConflict:
      description: The task repository is no longer waiting for a decision
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemResponse:
      description: Problem details error response
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
