[env]
XINGSHU_PORT = "12681"

[tools]
node = "24"
pnpm = "10"
rust = "1.88"

[tasks.setup]
depends = ["setup:ui", "setup:runtime"]
description = "Install dependencies for all modules"
alias = "setup"

[tasks."setup:ui"]
run = "pnpm --ignore-workspace install"
description = "Install WebUI dependencies"
dir = "webui"
alias = "setup:ui"

[tasks."setup:runtime"]
run = "cargo fetch"
description = "Fetch Rust dependencies"
alias = "setup:runtime"

[tasks.dev]
depends = ["dev:host"]
description = "Start server + WebUI (recommended daily entry)"
alias = "dev"

[tasks."dev:host"]
run = [{ tasks = ["dev:host:server", "dev:host:ui"] }]
description = "Run 12681 server and 12680 Vite in parallel (Ctrl+C cleans up)"
alias = "dev:host"

[tasks."dev:host:server"]
run = "cargo run -p xingshu-server"
description = "Start Rust API server on 12681 (dev DB by default; parent XINGSHU_DB wins)"
env = { XINGSHU_LOG_LEVEL = "info", XINGSHU_ENV = "dev" }

[tasks."prod:server"]
run = "cargo run -p xingshu-server"
description = "Start Rust API server on 12681 against the prod DB (refuses .staging paths)"
env = { XINGSHU_LOG_LEVEL = "info", XINGSHU_ENV = "prod" }
alias = "prod:server"

[tasks."dev:host:ui"]
run = "pnpm --ignore-workspace run dev"
description = "Start Vite dev server on 127.0.0.1:12680 (host/port/strictPort from vite.config.ts, proxies /api to 12681)"
dir = "webui"

[tasks."dev:server"]
run = "cargo run -p xingshu-server"
description = "Start Rust API server only"
alias = "dev:server"

[tasks."dev:ui"]
run = "pnpm --ignore-workspace run dev"
description = "Start Vite dev server only"
dir = "webui"
alias = "dev:ui"

[tasks.build]
depends = ["build:runtime", "build:ui"]
description = "Build all production artifacts"
alias = "build"

[tasks."build:runtime"]
run = "cargo build --workspace --release"
description = "Build Rust workspace (release)"
alias = "build:runtime"

[tasks."build:ui"]
run = "pnpm --ignore-workspace run build"
description = "Build WebUI bundle"
dir = "webui"
alias = "build:ui"

[tasks.test]
depends = ["test:release-prepare", "test:render-quickstart"]
run = "cargo test --workspace"
description = "Run release-prep and render-quickstart script tests and all Rust tests"
alias = "test"

[tasks."test:ui"]
run = "pnpm --ignore-workspace run typecheck"
description = "Run WebUI typecheck"
dir = "webui"
alias = "test:ui"

[tasks.lint]
depends = ["lint:core", "lint:fmt"]
description = "Run all linters"
alias = "lint"

[tasks."lint:core"]
run = "cargo clippy --workspace --all-targets -- -D warnings"
description = "Run clippy (deny warnings)"

[tasks."lint:fmt"]
run = "cargo fmt --all -- --check"
description = "Check Rust formatting"

[tasks.typecheck]
run = "pnpm --ignore-workspace run typecheck"
description = "Run WebUI typecheck (vue-tsc)"
dir = "webui"
alias = "typecheck"

[tasks.validate]
depends = ["lint", "typecheck", "build", "test"]
description = "Run all quality gates — lint + typecheck + build + test"
alias = "validate"

[tasks.clean]
run = "cargo clean; rm -rf webui/dist webui/node_modules/.vite"
description = "Remove build artifacts and temp caches"
alias = "clean"

[tasks.staging]
run = 'pwsh -NoProfile -File scripts/create-test-staging.ps1'
description = "Create a fresh synthetic .staging run using test repositories only"
alias = "staging"

[tasks."staging:dev"]
usage = 'flag "--run-id <run-id>" default="dev-001" help="Staging run id, used as .staging/<run-id>"'
run = 'pwsh -NoProfile -File scripts/create-test-staging.ps1 -TargetRoot .staging/{{usage.run_id}}'
description = "Create dev staging run under .staging/<run-id> (default dev-001)"
alias = "staging:dev"

[tasks."release:prepare"]
usage = '''
flag "--first-release" help="Keep workspace 0.1.0 for the first stable release"
flag "--bump <level>" help="Bump level: minor by default; patch explicit; major allowed at 1.0+"
flag "--dry-run" help="Preview only (default)"
flag "--execute" help="Apply cargo-release version step"
'''
run = "node scripts/release-prepare.mjs"
description = "Preview workspace version bump; minor default, patch explicit, major at 1.0+; cargo-release 1.1.7 required for bumps, no publish/tag/push"
alias = "release:prepare"

[tasks."test:release-prepare"]
run = "node --test scripts/tests/release-prepare.test.mjs scripts/tests/release-prepare-cargo-shim.test.mjs"
description = "Test release-preparation argument and version rules"
alias = "test:release-prepare"

[tasks."test:render-quickstart"]
run = "node --test scripts/tests/render-quickstart.test.mjs"
description = "Test QUICKSTART renderer placeholder, version line and repo-tree write guard"
alias = "test:render-quickstart"
