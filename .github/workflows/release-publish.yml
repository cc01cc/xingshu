name: Publish XS stable release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: xs-stable-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tag-matched candidate artifacts
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Locate successful candidate run for this exact commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable SemVer tags may create a Release."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          candidate_branch="release-candidate/$RELEASE_TAG"
          run_json="$RUNNER_TEMP/candidate-runs.json"
          gh api "repos/$REPOSITORY/actions/workflows/release-candidate.yml/runs?head_sha=$SOURCE_COMMIT&per_page=100" > "$run_json"
          candidate_run="$(jq -c --arg sha "$SOURCE_COMMIT" --arg repo "$REPOSITORY" --arg branch "$candidate_branch" '
            [ .workflow_runs[]
              | select(.head_sha == $sha)
              | select(.head_branch == $branch)
              | select(.status == "completed" and .conclusion == "success")
              | select(.event == "push")
              | select(.repository.full_name == $repo)
              | select((.head_repository.full_name // $repo) == $repo)
            ] | sort_by(.created_at) | last // empty
          ' "$run_json")"
          if [[ -z "$candidate_run" ]]; then
            echo "::error::No successful release-candidate workflow run matches this tag commit."
            exit 1
          fi
          comparison="$(gh api "repos/$REPOSITORY/compare/$SOURCE_COMMIT...main" --jq '.status')"
          if [[ "$comparison" != "ahead" && "$comparison" != "identical" ]]; then
            echo "::error::The tag commit is no longer an ancestor of the public default branch."
            exit 1
          fi
          run_id="$(jq -r '.id' <<<"$candidate_run")"
          [[ "$run_id" =~ ^[0-9]+$ ]]

          candidate_attempt="$(jq -r '.run_attempt // empty' <<<"$candidate_run")"
          [[ "$candidate_attempt" =~ ^[0-9]+$ ]]
          artifacts_json="$RUNNER_TEMP/candidate-artifacts.json"
          gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$artifacts_json"
          actual_artifacts="$(jq -r --arg suffix "-attempt-$candidate_attempt" '.artifacts[] | select(.expired == false) | select(.name | endswith($suffix)) | .name' "$artifacts_json" | sort)"
          expected_artifacts="$(printf '%s\n' \
            "xingshu-candidate-x86_64-pc-windows-msvc-attempt-$candidate_attempt" \
            "xingshu-candidate-x86_64-unknown-linux-gnu-attempt-$candidate_attempt" | sort)"
          if [[ "$actual_artifacts" != "$expected_artifacts" ]]; then
            echo "::error::The candidate run is missing, expired, foreign, or has unexpected artifacts."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_artifacts" "$actual_artifacts"
            exit 1
          fi

          printf 'candidate_run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'candidate_run_attempt=%s\n' "$candidate_attempt" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Download the exact candidate run artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: xingshu-candidate-*-attempt-${{ steps.candidate.outputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/xingshu-candidate-artifacts
          run-id: ${{ steps.candidate.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: false
      - name: Verify manifests and checksums; assemble original assets
        id: assets
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.candidate_run_attempt }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/xingshu-candidate-artifacts"
          asset_root="$RUNNER_TEMP/xingshu-release-assets"
          mkdir -p "$asset_root"
          expected_targets=(
            "x86_64-pc-windows-msvc"
            "x86_64-unknown-linux-gnu"
          )

          for target in "${expected_targets[@]}"; do
            artifact_dir="$artifact_root/xingshu-candidate-$target-attempt-$CANDIDATE_RUN_ATTEMPT"
            [[ -d "$artifact_dir" ]]
            file_count="$(find "$artifact_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)"
            nested_dir_count="$(find "$artifact_dir" -mindepth 1 -type d | wc -l)"
            [[ "$file_count" -eq 3 && "$nested_dir_count" -eq 0 ]]
            manifest_path="$(find "$artifact_dir" -maxdepth 1 -type f -name 'xingshu-v*.manifest.json' -print -quit)"
            [[ -n "$manifest_path" && -f "$manifest_path" ]]
            [[ "$(jq -r '.sourceRepository // empty' "$manifest_path")" == "$REPOSITORY" ]]
            [[ "$(jq -r '.sourceCommit // empty' "$manifest_path")" == "$SOURCE_COMMIT" ]]
            [[ "$(jq -r '.candidateRunId // empty' "$manifest_path")" == "$CANDIDATE_RUN_ID" ]]
            [[ "$(jq -r '.candidateRunAttempt // empty' "$manifest_path")" == "$CANDIDATE_RUN_ATTEMPT" ]]
            [[ "$(jq -r '.target // empty' "$manifest_path")" == "$target" ]]
            [[ "$(jq -r '.buildChannel // empty' "$manifest_path")" == "release" ]]
            [[ "$(jq -r '.signatureStatus // empty' "$manifest_path")" == "unsigned" ]]
            [[ "$(jq -r '.version // empty' "$manifest_path")" == "$VERSION" ]]
            [[ "$(basename "$manifest_path")" == "xingshu-v${VERSION}-${target}.manifest.json" ]]

            case "$target" in
              x86_64-pc-windows-msvc)
                expected_asset="xingshu-v${VERSION}-${target}.zip"
                expected_minimum_abi="Windows 10+"
                expected_runner="windows-2025"
                expected_crt_linkage="static"
                expected_runtime_prefix='["Git executable on PATH","Windows 10+"]'
                ;;
              x86_64-unknown-linux-gnu)
                expected_asset="xingshu-v${VERSION}-${target}.tar.gz"
                expected_minimum_abi="glibc 2.35+"
                expected_runner="ubuntu-22.04"
                expected_crt_linkage="dynamic-glibc"
                expected_runtime_prefix='["Git executable on PATH","glibc 2.35+"]'
                ;;
              *) echo "::error::Unsupported candidate target: $target"; exit 1 ;;
            esac
            dynamic_libraries="$(jq -c '(.dynamicLibraries // []) | sort' "$manifest_path")"
            if [[ "$target" == "x86_64-pc-windows-msvc" ]]; then
              [[ "$dynamic_libraries" == "[]" ]]
              expected_runtime_dependencies="$expected_runtime_prefix"
            else
              jq -e 'type == "array" and length > 0 and index("libc.so.6") != null and all(.[]; test("^[A-Za-z0-9_.+-]+\\.so(\\.[0-9]+)*$"))' <<<"$dynamic_libraries" >/dev/null
              expected_runtime_dependencies="$(jq -cn --argjson libs "$dynamic_libraries" '(["Git executable on PATH", "df executable on PATH", "glibc 2.35+"] + $libs) | sort')"
            fi
            [[ "$(jq -r '.minimumOsAbi // empty' "$manifest_path")" == "$expected_minimum_abi" ]]
            [[ "$(jq -r '.buildRunner // empty' "$manifest_path")" == "$expected_runner" ]]
            [[ "$(jq -r '.crtLinkage // empty' "$manifest_path")" == "$expected_crt_linkage" ]]
            runtime_dependencies="$(jq -c '.runtimeDependencies | sort' "$manifest_path")"
            [[ "$runtime_dependencies" == "$expected_runtime_dependencies" ]]
            git_version="$(jq -r '.gitVersion // empty' "$manifest_path")"
            [[ "$git_version" =~ ^git[[:space:]]version[[:space:]]+[^[:space:]]+ ]]
            asset_name="$(jq -r '.assetName // empty' "$manifest_path")"
            [[ "$asset_name" == "$expected_asset" ]]
            asset_path="$artifact_dir/$asset_name"
            checksum_path="$asset_path.sha256"
            [[ -f "$asset_path" && -f "$checksum_path" ]]
            manifest_hash="$(jq -r '.assetSha256 // empty' "$manifest_path")"
            [[ "$manifest_hash" =~ ^[0-9a-f]{64}$ ]]
            actual_hash="$(sha256sum "$asset_path" | awk '{print $1}')"
            [[ "$actual_hash" == "$manifest_hash" ]]
            grep -Fxq "$manifest_hash  $asset_name" "$checksum_path"
            (cd "$artifact_dir" && sha256sum --check "$(basename "$checksum_path")")

            # These are the exact candidate files; no rebuild or asset rewrite occurs here.
            cp -- "$asset_path" "$asset_root/$asset_name"
            cp -- "$checksum_path" "$asset_root/$(basename "$checksum_path")"
            cp -- "$manifest_path" "$asset_root/$(basename "$manifest_path")"
          done

          # Publish a deterministic release-only checksum summary from the verified per-archive entries.
          summary_path="$asset_root/SHA256SUMS"
          {
            cat "$asset_root/xingshu-v${VERSION}-x86_64-pc-windows-msvc.zip.sha256"
            cat "$asset_root/xingshu-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256"
          } | LC_ALL=C sort > "$summary_path"
          [[ "$(wc -l < "$summary_path")" -eq 2 ]]
          (cd "$asset_root" && sha256sum --check SHA256SUMS)
          printf 'asset_root=%s\n' "$asset_root" >> "$GITHUB_OUTPUT"
      - name: Checkout the tagged source for release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false
      - name: Extract the stable CHANGELOG section from the tag commit
        id: release-notes
        shell: bash
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/xingshu-release-notes.md"
          if ! awk -v version="$VERSION" '
            $0 == "## " version || index($0, "## " version " ") == 1 || $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              in_section = 1
              found = 1
              next
            }
            in_section && /^##[[:space:]]/ { exit }
            in_section { print }
            END { if (!found) exit 42 }
          ' release-source/CHANGELOG.md > "$notes_file"; then
            echo "::error::CHANGELOG.md in the tagged commit has no stable section for $VERSION."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::error::CHANGELOG.md stable section for $VERSION is empty."
            exit 1
          fi
          printf 'notes_file=%s\n' "$notes_file" >> "$GITHUB_OUTPUT"
      - name: Create or resume the Release after verifying the pushed tag
        shell: bash
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          ASSET_ROOT: ${{ steps.assets.outputs.asset_root }}
          NOTES_FILE: ${{ steps.release-notes.outputs.notes_file }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.candidate_run_attempt }}
        run: |
          set -Eeuo pipefail
          # The state machine lives in .github/scripts/publish-release-step.sh so that it can be
          # drilled locally (scripts/tests/publish-step-drill.sh: no network, no credentials).
          # The publish job's ONLY checkout lands in `release-source/`, so the script is always
          # addressed with that prefix; the repo-root path is never valid inside this job
          # (PLAN-0692 P0-2 / review/04-lead-adjudication.md §2).
          [[ -f release-source/.github/scripts/publish-release-step.sh ]] || {
            echo "::error::publish step script missing from the tag commit: release-source/.github/scripts/publish-release-step.sh"
            exit 1
          }
          bash release-source/.github/scripts/publish-release-step.sh
